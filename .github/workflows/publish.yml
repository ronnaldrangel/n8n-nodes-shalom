name: Publicar en npm

# Publica sin token, con Trusted Publishing (OIDC). npm autentica al runner por
# el id-token que GitHub firma, asi que no hay credencial que guardar ni rotar.
#
# Por que no se usa un token: npm esta retirando los tokens que omiten el 2FA.
# Desde agosto de 2026 esos tokens ya no publican directamente (el registro
# responde 403 E_STAGE_REQUIRED y solo aceptan subir a un area de staging) y en
# enero de 2027 quedan deshabilitados del todo.
#
# Requisito en npm (una sola vez): en npmjs.com, pagina del paquete ->
# Settings -> Trusted Publisher, declarar GitHub Actions con el usuario
# ronnaldrangel, el repositorio n8n-nodes-shalom y el workflow publish.yml.
#
# Se publica al empujar un tag vX.Y.Z (por ejemplo v1.0.5) o a mano desde la
# pestana Actions. Nunca al hacer push a main: asi una version publicada
# siempre corresponde a un tag concreto y se puede rastrear.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # necesario para la atestacion de procedencia de npm

jobs:
  publish:
    name: Compilar y publicar
    runs-on: ubuntu-latest
    steps:
      - name: Clonar el repositorio
        uses: actions/checkout@v4

      - name: Preparar Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"
          cache: "npm"

      - name: Actualizar npm (Trusted Publishing necesita npm 11.5.1 o superior)
        run: npm install -g npm@latest

      - name: Instalar dependencias
        run: npm ci

      - name: Comprobar que el tag coincide con la version del package.json
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./package.json').version")"
          echo "tag=$TAG package.json=$PKG"
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::El tag $TAG no coincide con la version $PKG de package.json"
            exit 1
          fi

      - name: Compilar
        run: npm run build

      - name: Publicar en npm
        run: npm publish --provenance --access public
